org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Deliberately off: the build cache was observed returning a stale/incorrect
# FROM-CACHE result for compileDebugKotlin that reported BUILD SUCCESSFUL for
# code with a genuine compile error caught moments later by a fresh lint run.
# Re-enable only after confirming that was a one-off, not a real cache-key bug.
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
