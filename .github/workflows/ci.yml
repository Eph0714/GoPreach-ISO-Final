name: CI

# Runs on every push and pull request, and can be started by hand from the "Actions" tab.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The check this project cannot do on a Windows PC: compile the shared Kotlin code for iOS (device + simulator)
  # and run its tests in the iOS Simulator. Needs a Mac, so it runs on GitHub's macOS runner.
  ios-shared:
    name: iOS (shared module)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Gradle also configures the Android modules, so it needs to know where the Android SDK is (preinstalled on the runner).
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compile shared code for iOS (device and simulator)
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Run shared tests on the iOS Simulator
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/**
          if-no-files-found: ignore

  # The Android app and every unit test, on a cheap Linux runner.
  android:
    name: Android (app + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # CI has no ~/.android/debug.keystore, which app/build.gradle.kts uses to sign debug builds.
      - name: Create the Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build the debug app and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :shared:testDebugUnitTest --stacktrace

      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/**
            shared/build/reports/tests/**
          if-no-files-found: ignore
